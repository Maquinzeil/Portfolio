<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Sample Social Media Case Study</title><desc id="desc">Sample campaign presentation for a fitness and wellness social media portfolio. Demonstration metrics are clearly labeled and are not claimed client results.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1e8ff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d3fe8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".10"/></filter></defs><rect width="1536" height="1024" fill="url(#bg)"/><circle cx="80" cy="80" r="70" fill="#8b5cf6" opacity=".08"/><circle cx="1460" cy="900" r="100" fill="#8b5cf6" opacity=".08"/><rect x="65" y="55" width="230" height="54" rx="27" fill="url(#purple)"/><text x="180" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">SAMPLE CAMPAIGN</text><text x="65" y="175" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#20212a">Fitness &amp; Wellness Brand</text><text x="65" y="220" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#7044e9">SOCIAL MEDIA MANAGEMENT</text><text x="65" y="270" font-family="Arial,sans-serif" font-size="20" fill="#565762">A sample project showcasing strategy, content creation,</text><text x="65" y="300" font-family="Arial,sans-serif" font-size="20" fill="#565762">and social media management.</text><rect x="65" y="345" width="185" height="62" rx="14" fill="#fff" filter="url(#shadow)"/><text x="157" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#30313b">Instagram</text><rect x="270" y="345" width="185" height="62" rx="14" fill="#fff" filter="url(#shadow)"/><text x="362" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#30313b">Facebook</text><text x="65" y="475" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#7044e9">CAMPAIGN OVERVIEW</text><rect x="65" y="500" width="445" height="235" rx="20" fill="#fff" filter="url(#shadow)"/><text x="95" y="545" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7044e9">Goal</text><text x="95" y="573" font-family="Arial,sans-serif" font-size="17" fill="#454650">Build awareness and engagement</text><text x="95" y="598" font-family="Arial,sans-serif" font-size="17" fill="#454650">through consistent content.</text><text x="95" y="645" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7044e9">Platforms</text><text x="95" y="673" font-family="Arial,sans-serif" font-size="17" fill="#454650">Instagram &amp; Facebook</text><text x="95" y="715" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#7044e9">Duration</text><text x="95" y="743" font-family="Arial,sans-serif" font-size="17" fill="#454650">30-day sample campaign</text><text x="555" y="475" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#7044e9">SAMPLE RESULTS (DEMONSTRATION)</text><g filter="url(#shadow)"><rect x="555" y="500" width="175" height="190" rx="20" fill="#fff"/><rect x="745" y="500" width="175" height="190" rx="20" fill="#fff"/><rect x="935" y="500" width="175" height="190" rx="20" fill="#fff"/><rect x="1125" y="500" width="175" height="190" rx="20" fill="#fff"/><rect x="1315" y="500" width="155" height="190" rx="20" fill="#fff"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><text x="642" y="580" font-size="38" font-weight="800" fill="#20212a">+32%</text><text x="642" y="614" font-size="16" fill="#565762">Engagement</text><text x="832" y="580" font-size="38" font-weight="800" fill="#20212a">+1.8K</text><text x="832" y="614" font-size="16" fill="#565762">Reach</text><text x="1022" y="580" font-size="38" font-weight="800" fill="#20212a">+427</text><text x="1022" y="614" font-size="16" fill="#565762">Interactions</text><text x="1212" y="580" font-size="38" font-weight="800" fill="#20212a">+265</text><text x="1212" y="614" font-size="16" fill="#565762">Profile visits</text><text x="1392" y="580" font-size="38" font-weight="800" fill="#20212a">12</text><text x="1392" y="614" font-size="16" fill="#565762">Posts created</text></g><text x="555" y="725" font-family="Arial,sans-serif" font-size="16" font-style="italic" fill="#666">Sample values for portfolio demonstration only. Not client analytics.</text><text x="65" y="805" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#7044e9">WHAT I DID</text><rect x="65" y="830" width="1235" height="105" rx="20" fill="#ede5ff"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#292a33"><text x="165" y="875" font-size="17" font-weight="700">Content Strategy</text><text x="355" y="875" font-size="17" font-weight="700">Content Creation</text><text x="545" y="875" font-size="17" font-weight="700">Content Calendar</text><text x="735" y="875" font-size="17" font-weight="700">Reels</text><text x="925" y="875" font-size="17" font-weight="700">Hashtag Research</text><text x="1115" y="875" font-size="17" font-weight="700">Engagement</text></g><text x="1360" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#7044e9">SAMPLE CASE STUDY</text></svg>